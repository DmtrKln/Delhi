<div class="contactUs__overlay">

    <div class="contactUs__wrapp">

        <div class="contactUs__formTitle">
          <h2>
            Связаться с нами
          </h2>
          <a href="#" class="contactUs__cross"><svg width="22" height="22" viewBox="0 0 22 22" fill="none"
              xmlns="http://www.w3.org/2000/svg">
              <path d="M0.625 0.625L20.625 20.625M20.625 0.625L0.625 20.625" stroke="white" stroke-opacity="0.8"
                stroke-width="1.25" stroke-linecap="round" />
            </svg></a>
          <p>Оставьте заявку и мы свяжемся с вами в ближайшее время</p>
        </div>
        <form action="">
          <div class="contactUs__form">
            <div class="contactUs__group">
              <div class="contactUs__field">
                <label for="name" class="contactUs__label">Имя</label>
                <input type="text" class="contactUs__input" placeholder="Ваше имя" required />
              </div>
              <div class="contactUs__field">
                <label for="name" class="contactUs__label">Телефон</label>
                <input type="text" class="contactUs__input" placeholder="+7 (___) ___-__-__" required />
              </div>
            </div>
            <div class="contactUs__field">
              <label for="name" class="contactUs__label">Email</label>
              <input type="email" class="contactUs__input" placeholder="name@company.ru" required />
            </div>
            <div class="contactUs__field">
              <label for="tel" class="contactUs__label">Сообщение</label>
              <textarea type="text" class="contactUs__input" placeholder="Ваш вопрос" required></textarea>
            </div>
          </div>
        </form>
        <button class="contactUs__btn btn-reset">
          Отправить
        </button>
      </div>
    </div>
  </div>
</div>
